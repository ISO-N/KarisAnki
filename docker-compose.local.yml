# 本地构建：从当前仓库源码构建单镜像。
# 服务器拉取 GHCR 镜像请使用 docker-compose.yml。
name: karisanki-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: karisanki
      POSTGRES_USER: ${DB_USERNAME:-karisanki}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-karisanki}
    volumes:
      - karisanki-local-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-karisanki} -d karisanki"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    image: karisanki:local
    build:
      context: .
      args:
        BACKEND_URL: http://127.0.0.1:8080
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/karisanki
      DB_USERNAME: ${DB_USERNAME:-karisanki}
      DB_PASSWORD: ${DB_PASSWORD:-karisanki}
      KARISANKI_REGISTRATION_ENABLED: ${KARISANKI_REGISTRATION_ENABLED:-true}
      KARISANKI_INVITE_CODES: ${KARISANKI_INVITE_CODES:-}
      KARISANKI_RATE_LIMIT_MAX_ATTEMPTS: ${KARISANKI_RATE_LIMIT_MAX_ATTEMPTS:-10}
      KARISANKI_RATE_LIMIT_WINDOW: ${KARISANKI_RATE_LIMIT_WINDOW:-10m}
      KARISANKI_IMPORT_MAX_SOURCE_BYTES: ${KARISANKI_IMPORT_MAX_SOURCE_BYTES:-2097152}
      KARISANKI_IMPORT_MAX_CARDS: ${KARISANKI_IMPORT_MAX_CARDS:-5000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  karisanki-local-postgres:
