services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: karisanki
      POSTGRES_USER: ${DB_USERNAME:-karisanki}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-karisanki}
    volumes:
      - karisanki-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-karisanki} -d karisanki"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/karisanki
      DB_USERNAME: ${DB_USERNAME:-karisanki}
      DB_PASSWORD: ${DB_PASSWORD:-karisanki}
      KARISANKI_INVITE_CODES: ${KARISANKI_INVITE_CODES:?set one or more comma-separated invite codes}
      KARISANKI_REGISTRATION_ENABLED: ${KARISANKI_REGISTRATION_ENABLED:-true}
      KARISANKI_RATE_LIMIT_MAX_ATTEMPTS: ${KARISANKI_RATE_LIMIT_MAX_ATTEMPTS:-10}
      KARISANKI_RATE_LIMIT_WINDOW: ${KARISANKI_RATE_LIMIT_WINDOW:-10m}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  karisanki-postgres:
