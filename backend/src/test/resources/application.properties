spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:18080/karisanki_test}
spring.datasource.username=${TEST_DB_USERNAME:karisanki}
spring.datasource.password=${TEST_DB_PASSWORD:karisanki}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30d

karisanki.registration-enabled=true
karisanki.invite-codes=testcode,othercode
karisanki.rate-limit-max-attempts=100
karisanki.import.max-source-bytes=4096
karisanki.import.max-cards=10
karisanki.rate-limit-window=10m
