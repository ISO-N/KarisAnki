spring.application.name=karisanki
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/karisanki}
spring.datasource.username=${DB_USERNAME:karisanki}
spring.datasource.password=${DB_PASSWORD:karisanki}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30d

server.servlet.session.cookie.name=KARISANKI_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

karisanki.registration-enabled=${KARISANKI_REGISTRATION_ENABLED:true}
karisanki.invite-codes=${KARISANKI_INVITE_CODES:}
karisanki.rate-limit-max-attempts=${KARISANKI_RATE_LIMIT_MAX_ATTEMPTS:10}
karisanki.rate-limit-window=${KARISANKI_RATE_LIMIT_WINDOW:10m}

karisanki.import.max-source-bytes=${KARISANKI_IMPORT_MAX_SOURCE_BYTES:2097152}
karisanki.import.max-cards=${KARISANKI_IMPORT_MAX_CARDS:5000}
