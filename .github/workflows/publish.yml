name: publish

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/karisanki:latest
            ghcr.io/${{ github.repository_owner }}/karisanki:sha-${{ github.sha }}
          build-args: |
            BACKEND_URL=http://127.0.0.1:8080
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune old GHCR versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          package_url=""

          owner_type="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.owner.type')"
          if [[ "${owner_type}" == "Organization" ]]; then
            package_url="orgs/${owner}/packages/container/karisanki"
          else
            package_url="users/${owner}/packages/container/karisanki"
          fi

          versions=""
          if ! versions="$(gh api "${package_url}/versions?per_page=100" --paginate --jq '.[] | "\(.created_at)\t\(.id)"' 2>ghcr-error.log)"; then
            if grep -Eq '"Not Found"|Not Found' ghcr-error.log; then
              echo "GHCR package does not exist yet; nothing to prune."
              exit 0
            fi
            cat ghcr-error.log >&2
            exit 1
          fi

          ids="$(printf '%s\n' "${versions}" | sort -r | tail -n +3 | cut -f2)"
          if [[ -z "${ids}" ]]; then
            echo "GHCR package has no more than two versions; nothing to prune."
            exit 0
          fi

          echo "Deleting old GHCR package versions:"
          printf '%s\n' "${ids}" | sed 's/^/  /'
          while IFS= read -r version_id; do
            [[ -z "${version_id}" ]] && continue
            gh api -X DELETE "${package_url}/versions/${version_id}"
          done <<< "${ids}"
