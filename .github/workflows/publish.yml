name: publish

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image names
        id: image
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/karisanki:latest
            ghcr.io/${{ steps.image.outputs.owner }}/karisanki:sha-${{ github.sha }}
          build-args: |
            BACKEND_URL=http://127.0.0.1:8080
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune old GHCR versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          package_url=""

          owner_type="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.owner.type')"
          if [[ "${owner_type}" == "Organization" ]]; then
            package_url="orgs/${owner}/packages/container/karisanki"
          else
            package_url="users/${owner}/packages/container/karisanki"
          fi

          versions=""
          if ! versions="$(gh api "${package_url}/versions?per_page=100" --paginate --jq '[.[] | {id, created_at, tags: (.metadata.container.tags // [])}] | sort_by(.created_at) | reverse' 2>ghcr-error.log)"; then
            if grep -Eq '"Not Found"|Not Found' ghcr-error.log; then
              echo "GHCR package does not exist yet; nothing to prune."
              exit 0
            fi
            cat ghcr-error.log >&2
            exit 1
          fi

          keep=2
          echo "${versions}" | jq -r 'to_entries[] | [(.key + 1 | tostring), .value.id, .value.created_at, (.value.tags | join(","))] | @tsv' |
          while IFS=$'\t' read -r idx id created tags; do
            if [[ ",${tags}," == *,latest,* ]]; then
              echo "keep[latest] id=${id} tags=[${tags}]"
              continue
            fi
            if (( idx <= keep )); then
              echo "keep[recent #${idx}] id=${id} tags=[${tags}]"
              continue
            fi
            echo "delete id=${id} tags=[${tags}]"
            gh api -X DELETE "${package_url}/versions/${id}"
          done
